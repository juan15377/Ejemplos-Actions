name: Enviar Correo

on:
  workflow_dispatch:
    inputs:
      data_url:
        description: 'URL de donde se obtienen los datos (opcional)'
        required: false
        type: string
        default: ''

jobs:
  generar-y-enviar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl requests

      - name: Generar Excel
        env:
          DATA_URL: ${{ github.event.inputs.data_url }}
        run: python Scripts/generar_excel.py

      - name: Enviar por correo
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.CORREO }}
          password: ${{ secrets.PASSWORD }}
          subject: Reporte automático diario
          to: juan1092jesus543@gmail.com
          from: Mi Workflow
          body: Adjunto el archivo Excel generado automáticamente.
          attachments: resultado.xlsx